name: Build APK & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for the release (e.g. v1.0.1). Leave blank to auto-generate.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode keystore (if provided)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "path=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_OUTPUT"
            echo "Using keystore from repository secret."
          elif [ -f "$GITHUB_WORKSPACE/gesture-volume-release.jks" ]; then
            echo "path=$GITHUB_WORKSPACE/gesture-volume-release.jks" >> "$GITHUB_OUTPUT"
            echo "Using keystore committed in the repo."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No keystore found - release APK will be unsigned."
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'gesturevolume' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'gesturevolume' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'gesturevolume' }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p dist
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          find app/build/outputs/apk -name "*.apk" -print
          cp app/build/outputs/apk/debug/app-debug.apk "dist/GestureVolume-$VERSION-debug.apk" || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/GestureVolume-$VERSION-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/GestureVolume-$VERSION-release-unsigned.apk"
          fi
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gesture-volume-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.collect.outputs.version }}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Gesture Volume ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*.apk
          body: |
            ## Gesture Volume ${{ steps.tag.outputs.tag }}

            **Gesture**
            - Two-finger swipe **UP** → volume up
            - Two-finger swipe **DOWN** → volume down

            Works in every app. Normal taps, scrolling and pinch-to-zoom are never blocked.

            **Widget** — a single home screen widget with:
            - `−` volume down, `+` volume up
            - mute / unmute toggle (icon reflects state)
            - a 10-segment tap slider to jump to any level
            - live percentage readout

            ### Install
            Download `GestureVolume-*-release.apk` below and install it.
            Then open the app → **Enable in Accessibility** → turn on *Gesture Volume*.

            > Requires **Android 15 (API 35)** or newer for the gesture feature.
            > The widget works on Android 7.0+.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
